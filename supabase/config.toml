# A string used to distinguish different Supabase projects on the same host. Defaults to the
# temporary name from the CLI.
project_id = "rxbuaedxbhfhaafvryio"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323
api_url = "http://localhost"

[auth]
enabled = true
site_url = "http://localhost:5173"
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.sms.twilio]
enabled = false
# SMS/Twilio is configured in Supabase Dashboard for production

[storage]
enabled = true
file_size_limit = "50MiB"

[functions.accept-invite]
verify_jwt = false
